; Exportní presety šablony GameForge (Godot 4.7).
; Cesty k výstupům se při exportu předávají z příkazové řádky, takže tady
; slouží jen jako výchozí hodnota. Šablony se hledají v
; %APPDATA%\Godot\export_templates\4.7.2.stable – a protože GameForge spouští
; Godot s přesměrovaným APPDATA, jsou uvnitř workspace.

[preset.0]

